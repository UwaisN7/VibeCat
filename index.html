<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VibeCat Music - drop a song on the moon or paste a YouTube link and press play.">
    <meta name="keywords" content="music player, cat, vibecat, purple cat, youtube player">
    <title>VibeCat Music Studio</title>
    <link rel="stylesheet" href="style.css">

    <script src="../JS/songStore.js" defer></script>
    <script src="../JS/songs.js" defer></script>

    <script src="../JS/moondrop.js" defer></script>
    <script src="../JS/youtubeApi.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div id="curtain" aria-hidden="true"></div>
    <div class="starfield" id="starfield" aria-hidden="true"></div>
 
    <header>
        <h1 id="main-heading">😺 VibeCat Music</h1>
       
        <p id="youtubeError" class="youtube-error" role="alert" hidden></p>
    </header>
    <main>
        <section class="player-section">
            <h2 id="upload-heading" class="visually-hidden">Add a song to play</h2>
 
            <video id="musicPlayer" class="music-player" controls loop hidden></video>
 
            <div id="youtubeEmbed" class="youtube-embed" hidden></div>
  
            <div class="moon-drop" id="dropZone">
                <input
                    type="file"
                    id="fileInput"
                    class="visually-hidden"
                    accept="audio/*,video/*"
                    aria-describedby="dropInstructions">
               <label for="fileInput" class="moon-label">
    <div class="moon-wrap">
        <span class="moon">
            <span class="crater crater--big"></span>
            <span class="crater crater--medium crater--medium-left"></span>
            <span class="crater crater--medium crater--medium-right"></span>
            <span class="crater crater--small"></span>
        </span>

        <svg class="moon-ring" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
                <path id="circlePath"
                      d="M 100,100 m -85,0 a 85,85 0 1,1 170,0 a 85,85 0 1,1 -170,0"
                      fill="none" />
            </defs>
            <text class="moon-ring__text">
                <textPath href="#circlePath" startOffset="25%" text-anchor="middle">
                    Drop Your Song
                </textPath>
            </text>
        </svg>
    </div>
</label>       
            </div>
 
            <div class="youtube-input">
               
                <div class="youtube-input__row">
                    <input
                        type="url"
                        id="youtubeLink"
                        name="youtubeLink"
                        inputmode="url"
                        placeholder="https://youtube.com/watch…">
                    <button type="button" id="loadYoutube">Load</button>
                </div>
                <!-- <p id="youtubeError" class="youtube-error" role="alert" hidden></p> -->
            </div>
        </section>
    </main>
 
    <footer>
     Comment idk how to comment in html but basically when the user does their thing a notification will pop up here telling them they can scroll down.
    </footer>
    <div style="height: 200vh; background: transparent;"></div>
    <script src="../JS/loadScreen.js"></script>
 <script src="../JS/stars.js" defer></script>
</body>
</html>
