<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VibeCat Music - drop a song on the moon or paste a YouTube link and press play.">
    <meta name="keywords" content="music player, cat, vibecat, purple cat, youtube player">
    <title>VibeCat Music Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="songs.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    
    <div class="starfield" id="starfield" aria-hidden="true"></div>
 
    <header>
        <h1 id="main-heading">😺 VibeCat Music</h1>
       
       
    </header>
 
    <main>
        <section class="player-section">
            <h2 id="upload-heading" class="visually-hidden">Add a song to play</h2>
 
            <video id="musicPlayer" class="music-player" controls loop hidden></video>
 
            <div id="youtubeEmbed" class="youtube-embed" hidden></div>
  
            <div class="moon-drop" id="dropZone">
                <input
                    type="file"
                    id="fileInput"
                    class="visually-hidden"
                    accept="audio/*,video/*"
                    aria-describedby="dropInstructions">
                <label for="fileInput" class="moon-label">
                     <div class="circle-text-container">
             <svg viewBox="0 0 100 100" width="200" height="200">
    <path id="circlePath" d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="purple" />
    <text>
      <textPath href="#circlePath" startOffset="25%" text-anchor="middle">
     Drop Your Song
      </textPath>
    </text>
  </svg>
</div>
                    <span class="moon">
                        <span class="crater crater--big"></span>
                        <span class="crater crater--medium crater--medium-left"></span>
                        <span class="crater crater--medium crater--medium-right"></span>
                        <span class="crater crater--small"></span>
                    </span>
                   
                </label>
            </div>
 
            <div class="youtube-input">
               
                <div class="youtube-input__row">
                    <input
                        type="url"
                        id="youtubeLink"
                        name="youtubeLink"
                        inputmode="url"
                        placeholder="https://youtube.com/watch?v=…">
                    <button type="button" id="loadYoutube">Load</button>
                </div>
                <p id="youtubeError" class="youtube-error" role="alert" hidden></p>
            </div>
        </section>
    </main>
 
    <footer>
     
    </footer>
 
    <script>
      
        (function generateStars() {
            const field = document.getElementById('starfield');
            const STAR_COUNT = 500;
            const fragment = document.createDocumentFragment();
 
            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
 
                const size = (Math.random() * 2 + 1).toFixed(2); // between 1px and 3px
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
 
                star.style.animationDelay = `${(Math.random() * 4).toFixed(2)}s`;
                star.style.animationDuration = `${(Math.random() * 3 + 2).toFixed(2)}s`;
 
                fragment.appendChild(star);
            }
            field.appendChild(fragment);
        })();
 
        // ---- 2. Moon as a drop zone ----
        // The <label for="fileInput"> already makes clicking the moon open the
        // file picker for free - that's just normal HTML behaviour, no JS needed.
        // Drag-and-drop needs a little help though: we add a class for visual
        // feedback, and forward any dropped file into the real <input> so
        // songs.js (which already listens for "change" on #fileInput) can
        // pick it up without knowing anything about drag-and-drop.
        (function setupMoonDrop() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
 
            ['dragenter', 'dragover'].forEach(evt =>
                dropZone.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('is-drag-over');
                })
            );
 
            ['dragleave', 'drop'].forEach(evt =>
                dropZone.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('is-drag-over');
                })
            );
 
            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files && files.length) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
        })();
 
        // ---- 3. YouTube link loader ----
        // This is the simplest form of the YouTube embed: we pull the 11-character
        // video id out of whatever URL shape the user pastes, then build an
        // https://www.youtube.com/embed/<id> iframe. It only works if the video's
        // owner has allowed embedding. Swapping this for the full YouTube IFrame
        // Player API later (for things like reading play/pause state) is a
        // straightforward next step once this is wired up.
        (function setupYoutubeLoader() {
            const linkInput = document.getElementById('youtubeLink');
            const loadButton = document.getElementById('loadYoutube');
            const errorMessage = document.getElementById('youtubeError');
            const embedContainer = document.getElementById('youtubeEmbed');
            const player = document.getElementById('musicPlayer');
 
            function extractVideoId(url) {
                const match = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
                return match ? match[1] : null;
            }
 
            loadButton.addEventListener('click', () => {
                const videoId = extractVideoId(linkInput.value.trim());
 
                if (!videoId) {
                    errorMessage.textContent = "That doesn't look like a YouTube link — try pasting the full video URL.";
                    errorMessage.hidden = false;
                    return;
                }
 
                errorMessage.hidden = true;
                player.hidden = true;
                embedContainer.hidden = false;
                embedContainer.innerHTML = `<iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>`;
            });
        })();
    </script>
</body>
</html>
