<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VibeCat Music - drop a song on the moon or paste a YouTube link and press play.">
    <meta name="keywords" content="music player, cat, vibecat, purple cat, youtube player">
    <title>VibeCat Music Studio</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../visualiser.css">
   <script src="../JS/songs.js" defer></script>
   <script src="../JS/songStore.js"defer></script>
   <script src="../JS/visualiser.Js"defer></script>
</head>

<body class="page-visualiser">
   
    <div class="starfield" id="starfield" aria-hidden="true"></div>

    <header>
        <h1 class="visually-hidden">VibeCat Music visualiser</h1>
    </header>
    <main>
        <div class="window-frame">
            <div class="outside-window">
                <div class="treeline"></div>
               <div class="ground" aria-hidden="true">
    <svg viewBox="0 0 315 101" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="purple-fade" x1="1" y1="1" x2="0" y2="0">
                <stop offset="0"   stop-color="#3B2C46" />  
                <stop offset="30"   stop-color="#c68fe8" />  
            </linearGradient>
        </defs>
        <ellipse cx="157.5" cy="50.5" rx="157.5" ry="50.5" fill="url(#purple-fade)"/>
    </svg>
</div>
      </div>
        </div>

       
        <div class="visualiser-section">
            
            <div class="visualiser-lines" aria-hidden="true">
              <canvas id="visualiserCanvas"></canvas>
            </div>
        </div>
          <div class="moon-corner">
             <input type="file" id="fileInput" class="visually-hidden">
    <label for="fileInput" class="moon-label">
            <span class="moon-wrap">
                <span class="moon">
                    <span class="crater crater--big"></span>
                    <span class="crater crater--medium crater--medium-left"></span>
                    <span class="crater crater--medium-right crater--medium"></span>
                    <span class="crater crater--small"></span>
                </span>
            </span>
    
        </div>
     
        <div class="window-sill">
            <section class="cat">
                   <div class="cat-body">
                    <div class="cat-eyes">
                        <div id="left-eye"></div>
                        <div id="right-eye"></div>
                    </div>
                   </div>
                    <div class="cat-ears">
                        <div id="left-ear"></div>
                        <div id="right-ear"></div>
                    </div>
            </section>
         
        </div>

        
        <!-- <nav class="controls" aria-label="Player controls">
            <button type="button" id="backToSettings">Settings</button>
          
            <div id="playerControls"></div>
        </nav> -->
    </main>
    
</body>

</html>
